<header class="d-flex jc-between ai-center p-2-3 header relative">
  <a routerLink="/" class="d-flex ai-center">
    <img src="./assets/images/swipinion-logo.svg" alt="" class="brand-logo" />
    <h1 class="ml-1 brand-name">Swipinion</h1>
  </a>

  <div *ngIf="authenticated$ | async; else buttons">
    Authenticated
  </div>

  <ng-template #buttons>
    <app-button class="mr-2" color="primary" text="Sign in" (clicked)="signIn(true)"></app-button>
    <app-flat-button color="accent" text="Sign up" (clicked)="signUp(true)"></app-flat-button>
  </ng-template>
</header>
