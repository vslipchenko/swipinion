<header class="d-flex jc-between ai-center py-1-2 px-2 header relative">
  <a routerLink="/" class="brand d-flex ai-center">
    <img src="./assets/images/swipinion-logo.svg" alt="" class="brand-logo" />
    <h1 class="ml-1 brand-name">Swipinion</h1>
  </a>

  <app-user-navbar *ngIf="authenticated$ | async; else buttons"></app-user-navbar>

  <ng-template #buttons>
    <div>
      <app-button class="mr-2" color="primary" text="Sign in" (clicked)="signIn(isHomepageScope)"></app-button>
      <app-flat-button color="accent" text="Sign up" (clicked)="signUp(isHomepageScope)"></app-flat-button>
    </div>
  </ng-template>
</header>
