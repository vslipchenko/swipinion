<div [class]="extendClass">
  <img *ngIf="imageSet" [src]="imageUrl.value || imagePreview" alt="" class="image d-block mx-auto" />

  <app-flat-button *ngIf="imageUrlSet" text="Remove" color="warn" class="d-block mb-3 mt-2"
                   extendClass="w-100"
                   (clicked)="resetImageUrl()"></app-flat-button>

  <mat-error *ngIf="!file.valid" class="mt-h">{{errorMessage(file.errors)}}</mat-error>

  <app-file-browser
    *ngIf="!imageUrl.value"
    class="d-block mt-2"
    [control]="file"
    [browseText]="browseText"
    [accept]="['image/jpeg', 'image/png', 'image/gif']"
    (fileChange)="setImagePreview($event)"
  ></app-file-browser>
</div>
