<app-input class="px-3-2" appearance="outline" label="Search people" extendClass="w-100"
           [control]="searchControl" [suffix]="suffix">
  <ng-template #suffix>
    <app-input-reset-suffix [show]="searchControl.value" (resetValue)="resetSearch()"></app-input-reset-suffix>
  </ng-template>
</app-input>

<app-progress-spinner *ngIf="loading$ | async; else container"
                      class="d-flex jc-center ai-center f-1"></app-progress-spinner>

<ng-template #container>
  <div class="primary-scrollbar mt-2">
    <div *ngFor="let user of userEssentials"
         class="d-flex ai-center py-2 px-3-2 message pointer search-results" (click)="startConversation(user)">
      <app-message-thumbnail thumbnailClass="message-thumbnail mr-2"
                             [thumbnail]="user.thumbnail"></app-message-thumbnail>

      <span class="truncate">{{user.username}}</span>
    </div>
  </div>
</ng-template>
