<app-accordion class="messages fixed" [hideToggle]="true" [panelTitle]="title" [panelDescription]="description"
               [content]="content" (afterExpand)="afterExpand()">
  <ng-template #title>
      <span class="relative d-flex mr-1">
              <mat-icon svgIcon="email-multiple"
                        [color]="(unreadMessages$ | async)?.length ? 'primary' : null"></mat-icon>
            </span>
    Messages
  </ng-template>

  <ng-template #description>
    <app-icon-button class="mr-h" svgIcon="square-edit-outline"></app-icon-button>
    <mat-icon class="expand-arrow">expand_less</mat-icon>
  </ng-template>

  <ng-template #content>
    <div class="content relative h-100">
      <app-progress-spinner *ngIf="loading$ | async; else container"
                            class="d-flex jc-center ai-center h-100"></app-progress-spinner>

      <ng-template #container>
        <div [class.h-0]="showConversation" class="h-100">
          <!--        <app-tabs [tabs]="tabs"></app-tabs>-->
          <div class="list primary-scrollbar h-100 d-flex f-column">
            <div class="transparent-divider"></div>
            <app-message icon="bookmark" [username]="'Saved Messages'" [message]="'Lol some'"
                         date="28 July" (clicked)="loadConversation(true)"></app-message>

            <ng-container *ngIf="messages$ | async as messages">
              <app-content-placeholder *ngIf="!messages.length; else messageList" svgIcon="email-multiple"
                                       text="New messages will show up here"
                                       class="h-100 messages-placeholder" [border]="false"
                                       [gradient]="false"></app-content-placeholder>

              <ng-template #messageList>
                <div *ngFor="let message of messages$ | async">
                  <div class="transparent-divider"></div>
                  <app-message [thumbnail]="message.thumbnail" [username]="message.username" [message]="message.teaser"
                               [date]="message.date" [outgoing]="message.sender_id === userId"
                               (clicked)="loadConversation(false, message)"
                               [unread]="message.unread"></app-message>
                </div>
              </ng-template>

              <app-progress-spinner
                *ngIf="canLoadMore$ | async"
                (appInView)="spinnerInView($event, messages[messages.length - 1].id)"
                class="d-flex jc-center ai-center h-100 conversations-spinner"></app-progress-spinner>
            </ng-container>
          </div>
        </div>
      </ng-template>

      <div class="messaging h-100" *ngIf="showConversation">
        <app-conversation [conversationInfo]="$any(conversationInfo$ | async)"
                          (back)="showConversation = false"></app-conversation>
      </div>
    </div>
  </ng-template>
</app-accordion>
