<app-accordion class="messages fixed" [hideToggle]="true" [panelTitle]="title" [panelDescription]="description"
               [content]="content" (afterExpand)="afterExpand()">
  <ng-template #title>
      <span class="relative d-flex mr-1">
              <mat-icon svgIcon="email-multiple" color="primary"></mat-icon>
            </span>
    Messages
  </ng-template>

  <ng-template #description>
    <app-icon-button class="mr-h" svgIcon="square-edit-outline"></app-icon-button>
    <mat-icon class="expand-arrow">expand_less</mat-icon>
  </ng-template>

  <ng-template #content>
    <div class="content relative h-100">
      <app-progress-spinner *ngIf="loading$ | async; else messageList"
                            class="d-flex jc-center ai-center spinner h-100"></app-progress-spinner>

      <ng-template #messageList>
        <div [class.h-0]="showChat" class="h-100">
          <!--        <app-tabs [tabs]="tabs"></app-tabs>-->
          <div class="list primary-scrollbar h-100">
            <div class="transparent-divider"></div>
            <app-message icon="bookmark" [username]="'Saved Messages'" [message]="'Lol some'"
                         date="28 July" (clicked)="showChat = true"></app-message>

            <div *ngFor="let message of messages">
              <div class="transparent-divider"></div>
              <app-message [thumbnail]="message.thumbnail" [username]="message.username" [message]="message.message"
                           date="28 July" (clicked)="showChat = true"></app-message>
            </div>
          </div>
        </div>
      </ng-template>

      <div class="messaging h-100" *ngIf="showChat">
        <app-chat (back)="showChat = false"></app-chat>
      </div>

      <div class="dimmer absolute"></div>
    </div>
  </ng-template>
</app-accordion>
