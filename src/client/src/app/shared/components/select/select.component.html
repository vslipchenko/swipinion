<mat-form-field [appearance]="appearance" [color]="color" [class]="extendClass">
  <mat-label>{{ label }}</mat-label>
  <mat-select [formControl]="control" [required]="isRequired">
<!--    <mat-option *ngIf="emptyOption" [value]="null">—</mat-option>-->

    <mat-option *ngFor="let item of items" [value]="item.value">
      {{ item.title }}
    </mat-option>

<!--    <mat-optgroup *ngFor="let group of itemGroups" [label]="group.name">-->
<!--      <mat-option *ngFor="let groupItem of group.value" [value]="groupItem.value">-->
<!--        {{groupItem.title}}-->
<!--      </mat-option>-->
<!--    </mat-optgroup>-->
  </mat-select>
  <mat-hint *ngIf="hint">
    <ng-container [ngTemplateOutlet]="hint"></ng-container>
  </mat-hint>
  <mat-error *ngIf="control.invalid && errorMessage">{{ errorMessage(control.errors) }}</mat-error>
</mat-form-field>
