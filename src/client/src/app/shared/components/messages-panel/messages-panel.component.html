<div class="messages-panel fixed d-flex px-2 jc-end">
  <ng-container *ngIf="{activeConversation: activeConversation$ | async} as data">
    <app-conversation-accordion *ngIf="data.activeConversation"
                                [activeConversation]="data.activeConversation"
                                class="d-block f-h mt-auto"></app-conversation-accordion>

    <app-messages class="d-block ml-2 mt-auto messages f-h"></app-messages>
  </ng-container>
</div>
