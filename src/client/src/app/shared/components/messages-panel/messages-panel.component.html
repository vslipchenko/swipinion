<div class="messages messages-panel fixed d-flex px-2 jc-end pe-none"
     [class.lifted-up]="messagesPanelService.liftUpConversationAccordion$ | async">
  <app-conversation-accordion *ngIf="conversation$ | async as conversation"
                              [conversation]="conversation"
                              [collapsable]="true"
                              (navigateProfile)="collapseMessagesAccordion(messages)"
                              class="d-block f-1-h mt-auto mw-0 pe-auto"></app-conversation-accordion>

  <app-messages #messages class="d-block ml-2 mt-auto messages-accordion f-1-h mw-0 pe-auto"></app-messages>
</div>
