<mat-icon *ngIf="icon; else image"
          class="d-flex jc-center ai-center" [class]="iconClass"
>{{icon}}</mat-icon>

<ng-template #image>
  <img *ngIf="thumbnail" [src]="thumbnail" alt="" class="thumbnail mr-2" [class]="thumbnailClass">
  <div *ngIf="!thumbnail" class="thumbnail mr-2" [class]="thumbnailClass"></div>
</ng-template>
