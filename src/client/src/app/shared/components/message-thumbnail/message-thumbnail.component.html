<mat-icon *ngIf="icon; else image" color="accent"
          class="saved-messages-icon d-flex jc-center ai-center mr-2">{{icon}}</mat-icon>

<ng-template #image>
  <img *ngIf="thumbnail" [src]="thumbnail" alt="" class="thumbnail mr-2">
  <div *ngIf="!thumbnail" class="thumbnail mr-2"></div>
</ng-template>
