<div class="messaging-content relative pb-2 h-100 d-flex f-column">
  <div class="panel p-2 d-flex jc-between">
    <div class="d-flex ai-center">
      <mat-icon *ngIf="conversationInfo.savedMessages; else image" color="accent"
                class="saved-messages-icon d-flex jc-center ai-center mr-2">bookmark
      </mat-icon>

      <ng-template #image>
        <img *ngIf="conversationInfo.message.thumbnail" [src]="conversationInfo.message.thumbnail"
             alt="" class="thumbnail mr-2">
        <div *ngIf="!conversationInfo.message.thumbnail" class="thumbnail mr-2"></div>
      </ng-template>

      <div>
        <a *ngIf="conversationInfo.message.username" class="fw-medium truncate link"
           routerLink="/user/{{username}}">{{username}}</a>

        <span *ngIf="!conversationInfo.message.username" class="fw-medium truncate">{{username}}</span>
      </div>
    </div>

    <div>
      <app-icon-button icon="arrow_back" (clicked)="back.emit()"></app-icon-button>
    </div>
  </div>

  <ng-container *ngIf="conversationMessages$ | async as messages">
    <div class="message-body d-flex px-2 primary-scrollbar relative h-100"
         [class.pb-2]="conversationInfo.message.username">
      <app-progress-spinner
        *ngIf="loading$ | async; else container"
        class="d-flex jc-center ai-center h-100"></app-progress-spinner>

      <ng-template #container>
        <ng-container *ngFor="let item of messages; let first = first">
          <app-conversation-message [first]="first" [message]="item"
                                    [interlocutorId]="interlocutorId"
                                    [class.mb-auto]="first"></app-conversation-message>

          <div *ngIf="item.dateTile" class="d-flex jc-center mb-1">
            <div class="conversation-date">{{item.dateTile}}</div>
          </div>
        </ng-container>

        <app-progress-spinner
          *ngIf="canLoadMore$ | async"
          (appInView)="spinnerInView($event, messages[messages.length - 1].id)"
          class="d-flex jc-center ai-center h-100 conversations-spinner"></app-progress-spinner>
      </ng-template>
    </div>

    <div *ngIf="conversationInfo.message.username || conversationInfo.savedMessages" class="px-2 d-flex ai-center">
      <app-textarea #textarea class="d-block w-100" extendClass="w-100" appearance="outline"></app-textarea>

      <app-mini-fab-button *ngIf="textarea.control.value?.length" icon="send" color="primary"
                           (clicked)="sendMessage(textarea, messages)"
                           [disabled]="$any(loading$ | async) || this.disableSendButton"
                           class="ml-2"></app-mini-fab-button>
    </div>
  </ng-container>
</div>
