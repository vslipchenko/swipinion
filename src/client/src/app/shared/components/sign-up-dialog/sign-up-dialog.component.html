<h2 mat-dialog-title>Sign up</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="visible">
    <app-input
      class="d-block mb-1"
      extendClass="w-100"
      appearance="outline"
      label="Username"
      [render]="renderUsername$.asObservable()"
      [control]="username"
      [errorMessage]="usernameErrorMessage"
      [hint]="usernameHint"
    >
      <ng-template #usernameHint>
        Can contain lowercase letters with dot as a separator
      </ng-template>
    </app-input>
    <app-input
      class="d-block mb-1"
      extendClass="w-100"
      appearance="outline"
      label="Email"
      type="email"
      [render]="renderEmail$.asObservable()"
      [control]="email"
      [errorMessage]="emailErrorMessage"
    ></app-input>
    <app-input
      #passwordInput
      class="d-block"
      extendClass="w-100"
      appearance="outline"
      label="Password"
      type="password"
      [control]="password"
      [errorMessage]="passwordErrorMessage"
      [suffix]="suffix"
      [hint]="passwordHint"
    >
      <ng-template #passwordHint>
        At least one letter and digit. Allowed special characters
      </ng-template>

      <ng-template #suffix>
        <app-input-hide-suffix [input]="passwordInput"></app-input-hide-suffix>
      </ng-template>
    </app-input>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Close" (clicked)="cancel.emit()"></app-button>
    <app-button color="primary" text="Sign up" (clicked)="signUp()" [disabled]="state.loading || false"></app-button>
  </mat-dialog-actions>
</ng-container>
