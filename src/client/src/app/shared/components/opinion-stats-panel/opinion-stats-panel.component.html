<app-button [text]="agreed"
            icon-="thumb_up"
            [extendClass]="'d-flex jc-center card-stat-button fs-regular-small w-100 br-0 ' + buttonClass"
            iconClass="mr-h"
            class="f-1"></app-button>

<app-button [text]="disagreed"
            icon="thumb_down"
            [extendClass]="'d-flex jc-center card-stat-button fs-regular-small w-100 br-0 ' + buttonClass"
            iconClass="mr-h"
            class="f-1"></app-button>

<app-button [text]="comments"
            svgIcon="comment-outline"
            [extendClass]="'d-flex jc-center card-stat-button fs-regular-small w-100 br-0 ' + buttonClass"
            iconClass="mr-h"
            class="f-1"></app-button>
