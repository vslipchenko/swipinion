<div class="d-flex ai-center p-2 message pointer relative" [class.unread]="!read" (click)="clicked.emit(senderId)">
  <mat-icon *ngIf="icon; else image" color="accent"
            class="saved-messages-icon d-flex jc-center ai-center mr-2">{{icon}}</mat-icon>

  <ng-template #image>
    <img *ngIf="thumbnail" [src]="thumbnail" alt="" class="thumbnail mr-2">
    <div *ngIf="!thumbnail" class="thumbnail mr-2"></div>
  </ng-template>

  <div class="w-100 message-info">
    <div class="d-flex jc-between ai-center">
      <div class="fw-medium">{{username || 'Deleted Account'}}</div>
      <div class="date">{{date}}</div>
    </div>

    <div class="truncate">{{message}}</div>
  </div>
</div>
