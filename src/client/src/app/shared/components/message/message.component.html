<div class="d-flex ai-center py-2 px-3 item pointer" (click)="clicked.emit(senderId)">
  <img *ngIf="thumbnail" [src]="thumbnail" alt="" class="thumbnail mr-2">
  <div *ngIf="!thumbnail" class="thumbnail mr-2"></div>

  <div class="w-100 message-info">
    <div class="d-flex jc-between ai-center">
      <div class="fw-medium">{{username}}</div>
      <div class="date">{{date}}</div>
    </div>

    <div class="truncate">{{message}}</div>
  </div>
</div>
