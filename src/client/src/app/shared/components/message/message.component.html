<div class="d-flex ai-center p-2 message pointer relative" [class.unread]="unread" (click)="clicked.emit(senderId)">
  <app-message-thumbnail iconClass="saved-messages-icon mr-2" thumbnailClass="message-thumbnail" [icon]="icon"
                         [thumbnail]="thumbnail"></app-message-thumbnail>

  <div class="w-100 mw-0">
    <div class="d-flex jc-between ai-center">
      <div class="fw-medium truncate">{{username || 'Deleted Account'}}</div>
      <div class="date">{{date}}</div>
    </div>

    <div class="d-flex">
      <div *ngIf="outgoing" class="outgoing-label mr-1">You:</div>
      <div class="truncate">{{message}}</div>
    </div>
  </div>
</div>
