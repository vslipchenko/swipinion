<mat-accordion>
  <mat-expansion-panel [hideToggle]="hideToggle" (afterExpand)="afterExpand.emit()"
                       (afterCollapse)="afterCollapse.emit()">
    <mat-expansion-panel-header>
      <mat-panel-title *ngIf="panelTitle" [class]="titleClass">
        <ng-container [ngTemplateOutlet]="panelTitle"></ng-container>
      </mat-panel-title>
      <mat-panel-description *ngIf="panelDescription">
        <ng-container [ngTemplateOutlet]="panelDescription"></ng-container>
      </mat-panel-description>
    </mat-expansion-panel-header>

    <ng-container *ngIf="content" [ngTemplateOutlet]="content"></ng-container>
  </mat-expansion-panel>
</mat-accordion>
