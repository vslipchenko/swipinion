<mat-tab-group animationDuration="0ms" [color]="color" [headerPosition]="headerPosition">
  <mat-tab *ngFor="let tab of tabs" (click)="clicked.emit(tab)">
    <ng-template mat-tab-label>
      <mat-icon *ngIf="tab.icon || tab.svgIcon" [svgIcon]="$any(tab.svgIcon)" class="mr-1">{{tab.icon}}</mat-icon>
      {{tab.text}}</ng-template>
  </mat-tab>
</mat-tab-group>
