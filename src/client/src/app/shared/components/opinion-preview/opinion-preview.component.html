<div class="preview">
  <div class="d-flex relative frame">
    <div *ngIf="!body" [style.background-image]="'url(' + fileUrl + ')'"
         class="background background-blurred w-100 h-100 absolute"></div>
    <img *ngIf="fileUrl" [src]="fileUrl" alt="">
    <div *ngIf="body" class="content p-2 relative">
      <p>{{body}}</p>
      <div class="dimmer absolute w-100"></div>
    </div>
  </div>
  <app-card-tags *ngIf="tags.length" [tags]="tags" class="tags d-block" [class.p-2]="tags.length"></app-card-tags>
  <div class="actions d-flex">
    <app-button class="f-1" extendClass="w-100 p-1 br-0" icon="open_in_new"
                routerLink="/opinion/{{id}}"></app-button>

    <app-button *ngIf="menuItems.menu" [matMenuTriggerFor]="menuItems.menu" class="f-1" extendClass="w-100 py-1 br-0"
                icon="menu"></app-button>
    <app-menu-items #menuItems [items]="$any(opinionItems$ | async)"
                    [context]="id"></app-menu-items>
  </div>
  <app-opinion-stats-panel [agreed]="agreed" [disagreed]="disagreed" [comments]="comments"
                           [highlightAgreed]="highlightAgreed"
                           [highlightDisagreed]="highlightDisagreed"
                           [highlightComment]="commented"
                           class="d-flex jc-around" buttonClass="py-1"></app-opinion-stats-panel>
</div>
