<div class="p-2 container">
  <div class="relative">
    <mat-icon *ngIf="tip" class="tip absolute pointer"
              [matTooltip]="tip"
    >help
    </mat-icon>

    <mat-icon class="icon d-block mx-auto">{{icon}}</mat-icon>
    <p *ngIf="text" class="mt-1 t-center">{{text}}</p>

    <ng-content></ng-content>
  </div>
</div>
