<h2 mat-dialog-title>Share opinion</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="scrollable">
    <app-select
      class="d-block"
      extendClass="w-100"
      appearance="outline"
      label="Type"
      [items]="options"
      [control]="type"
    ></app-select>

    <div *ngIf="imageType" [class.error-border]="hasImageErrorBorder">
      <app-image-browser
        [imageUrl]="fileUrl"
        [file]="file"
        [imageUrlErrorMessage]="imageUrlErrorMessage"
      ></app-image-browser>
    </div>

    <app-input
      class="d-block"
      extendClass="w-100"
      appearance="outline"
      label="Title"
      [control]="title"
      [errorMessage]="titleErrorMessage"
      [hint]="titleHint"
      hintAlign="end"
    >
      <ng-template #titleHint>
        {{ title.value?.length || 0 }} / {{ titleMaxLength }}
      </ng-template>
    </app-input>

    <app-textarea
      appearance="outline"
      label="Description"
      class="d-block w-100"
      extendClass="w-100"
      [control]="description"
      hintAlign="end"
      [hint]="descriptionHint"
      [errorMessage]="descriptionErrorMessage.bind(this)"
    >
      <ng-template #descriptionHint>{{ description.value?.length || 0 }} / {{ descriptionMaxLength }}</ng-template>
    </app-textarea>

    <app-chips
      appearance="outline"
      label="Tags"
      extendClass="d-block w-100"
      placeholder="E.g. champinion, you-decide"
      [regexp]="hashtagRegexp"
      [hint]="chipsHint"
      [control]="tags"
    >
      <ng-template #chipsHint> Tag can contain letters, numbers, dash as separator (35 characters at max)</ng-template>
    </app-chips>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Cancel"></app-button>
    <app-button color="primary" text="Share" (clicked)="share()" [disabled]="state.loading || false"></app-button>
  </mat-dialog-actions>
</ng-container>
