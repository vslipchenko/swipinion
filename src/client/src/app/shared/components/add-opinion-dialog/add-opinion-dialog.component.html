<h2 mat-dialog-title>Share opinion</h2>
<mat-dialog-content class="relative py-2 scrollable">
  <app-progress-spinner *ngIf="loading$ | async" class="overlay bg-fog"></app-progress-spinner>

  <app-select
    class="d-block"
    extendClass="w-100"
    appearance="outline"
    label="Type"
    [items]="options"
    [control]="type"
  ></app-select>

  <div [class.error-border]="hasImageErrorBorder">
    <app-image-browser [imageUrl]="imageUrl" [file]="file" [imageUrlErrorMessage]="imageUrlErrorMessage"></app-image-browser>
  </div>

  <app-input
    class="d-block"
    extendClass="w-100"
    appearance="outline"
    label="Title"
    [control]="title"
    [errorMessage]="errorMessage"
  ></app-input>

  <app-textarea
    appearance="outline"
    label="Description"
    class="d-block w-100"
    extendClass="w-100"
    [control]="description"
    hintAlign="end"
    [hint]="descriptionHint"
  >
    <ng-template #descriptionHint>{{description.value?.length || 0}} / 3000</ng-template>
  </app-textarea>

  <app-chips appearance="outline" label="Tags" extendClass="d-block w-100" placeholder="E.g. champinion, prove-me-wrong" [regexp]="hashtagRegexp" [hint]="chipsHint">
    <ng-template #chipsHint>
      Can contain letters, numbers, dash as separator
    </ng-template>
  </app-chips>
</mat-dialog-content>
<mat-dialog-actions>
  <app-button mat-dialog-close text="Cancel"></app-button>
  <app-button color="primary" text="Share" (clicked)="share()"></app-button>
</mat-dialog-actions>
