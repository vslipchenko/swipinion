<h2 mat-dialog-title>Password recovery</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="visible">
    <app-input
      *ngIf="(recoverStage$ | async) === recoveryStage.Email"
      type="email"
      [control]="email"
      appearance="outline"
      label="Email"
      [hint]="hint"
      [errorMessage]="errorMessage"
      extendClass="w-100"
    >
      <ng-template #hint>Confirmation email will be sent to this address</ng-template>
    </app-input>

    <app-input
      *ngIf="(recoverStage$ | async) === recoveryStage.Code"
      class="d-block mb-1"
      extendClass="w-100"
      appearance="outline"
      label="Code"
      maxlength="6"
      [control]="code"
      [errorMessage]="errorMessage"
      [hint]="hint"
    >
      <ng-template #hint>
        Confirmation code received by the email
      </ng-template>
    </app-input>

    <ng-container *ngIf="(recoverStage$ | async) === recoveryStage.NewPassword">
      <app-input
        #passwordInput
        extendClass="w-100"
        appearance="outline"
        label="New password"
        type="password"
        [control]="password"
        [errorMessage]="passwordErrorMessage"
        [suffix]="passwordSuffix"
      >
        <ng-template #passwordSuffix>
          <app-input-hide-suffix [input]="passwordInput"></app-input-hide-suffix>
        </ng-template>
      </app-input>

      <app-input
        #repeatPasswordInput
        extendClass="w-100"
        appearance="outline"
        label="Repeat password"
        type="password"
        [control]="repeatPassword"
        [errorMessage]="repeatPasswordErrorMessage"
        [suffix]="repeatPasswordSuffix"
      >
        <ng-template #repeatPasswordSuffix>
          <app-input-hide-suffix [input]="repeatPasswordInput"></app-input-hide-suffix>
        </ng-template>
      </app-input>
    </ng-container>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Close" (clicked)="cancel.emit()"></app-button>
    <app-button *ngIf="(recoverStage$ | async) === recoveryStage.Email" color="primary" text="Next"
                (clicked)="recover()"></app-button>
    <app-button *ngIf="(recoverStage$ | async) === recoveryStage.Code" color="primary" text="Next"
                (clicked)="verifyCode()"></app-button>
    <app-button *ngIf="(recoverStage$ | async) === recoveryStage.NewPassword" color="primary" text="Save"
                (clicked)="setNewPassword()"></app-button>
  </mat-dialog-actions>
</ng-container>
