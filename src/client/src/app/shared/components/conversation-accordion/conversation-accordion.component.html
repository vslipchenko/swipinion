<app-accordion (afterExpand)="afterExpand.emit()" (click)="preventCollapse()" [hideToggle]="true"
               [panelTitle]="title"
               [panelDescription]="description"
               [content]="content" titleClass="conversation-title mw-0"
               [panelClass]="outline ? 'bt-transparent bl-transparent br-transparent' : ''"
               [headerClass]="(unread$ | async) ? 'primary-indicator' : ''">
  <ng-template #title>
    <app-conversation-thumbnail *ngIf="renderUi$ | async"
                                class="d-flex ai-center title mw-0"
                                [thumbnail]="conversation.thumbnail"
                                [username]="conversation.username"
                                [newConversation]="newConversation"
                                [savedMessages]="savedMessages"
                                (thumbnailClicked)="collapseAccordions($event)"></app-conversation-thumbnail>
  </ng-template>

  <ng-template #description>
    <app-icon-button icon="close" (clicked)="closeAccordion($event)"></app-icon-button>
  </ng-template>

  <ng-template #content>
    <div class="content">
      <ng-container *ngIf="renderUi$ | async">
        <app-conversation-user-search *ngIf="newConversation"
                                      class="d-flex f-column h-100"></app-conversation-user-search>

        <app-conversation *ngIf="!newConversation" [accordionExpanded]="accordion.afterExpand"
                          [accordionCollapsed]="accordion.afterCollapse" [savedMessages]="savedMessages"
                          [username]="conversation.username" [thumbnail]="conversation.thumbnail"
                          [userId1]="conversation.userId1" [userId2]="conversation.userId2"
                          [unread]="conversation.unread"></app-conversation>
      </ng-container>
    </div>
  </ng-template>
</app-accordion>
