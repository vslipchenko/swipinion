<app-accordion [hideToggle]="true" [panelTitle]="title" [panelDescription]="description"
               [content]="content" titleClass="conversation-title mw-0">
  <ng-template #title>
    <span class="d-flex ai-center title mw-0">
      <app-message-thumbnail class="d-flex conversation-accordion-thumbnail"
                             thumbnailClass="conversation-thumbnail"
                             [icon]="icon"
                             [thumbnail]="thumbnail"
                             [thumbnailLink]="userConversation ? '/user/' + headline : ''"></app-message-thumbnail>
      <span class="truncate ml-1" [class.conversation-headline]="userConversation">{{headline}}</span>
    </span>
  </ng-template>

  <ng-template #description>
    <!--    <mat-icon class="expand-arrow">expand_less</mat-icon>-->
    <app-icon-button icon="close" (clicked)="closeAccordion($event)"></app-icon-button>
  </ng-template>

  <ng-template #content>
    <div class="content h-100">
      Something
    </div>
  </ng-template>
</app-accordion>
