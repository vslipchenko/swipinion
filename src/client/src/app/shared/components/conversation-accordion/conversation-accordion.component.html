<app-accordion [hideToggle]="true" [panelTitle]="title" [panelDescription]="description"
               [content]="content">
  <ng-template #title>
    <span class="d-flex ai-center title">
      <app-message-thumbnail class="d-flex" thumbnailClass="conversation-thumbnail" iconClass="mr-1" [icon]="icon"
                             [thumbnail]="thumbnail"></app-message-thumbnail>
      {{headline}}</span>
  </ng-template>

  <ng-template #description>
    <!--    <mat-icon class="expand-arrow">expand_less</mat-icon>-->
    <app-icon-button icon="close" (clicked)="closeAccordion($event)"></app-icon-button>
  </ng-template>

  <ng-template #content>
    <div class="content h-100">
      Something
    </div>
  </ng-template>
</app-accordion>
