<app-accordion [hideToggle]="true" [panelTitle]="title" [panelDescription]="description"
               [content]="content">
  <ng-template #title>
    <span class="d-flex ai-center"><app-message-thumbnail></app-message-thumbnail>
      {{headline}}</span>
  </ng-template>

  <ng-template #description>
    <mat-icon class="expand-arrow">expand_less</mat-icon>
  </ng-template>

  <ng-template #content>
    <div class="content h-100">
      Something
    </div>
  </ng-template>
</app-accordion>
