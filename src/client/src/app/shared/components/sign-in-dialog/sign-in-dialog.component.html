<h2 mat-dialog-title>Sign in</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="visible">
    <app-input
      type="email"
      appearance="outline"
      label="Email"
      extendClass="w-100"
      [control]="email"
      [errorMessage]="errorMessage"
    ></app-input>
    <app-input
      #input
      type="password"
      appearance="outline"
      label="Пароль"
      extendClass="w-100"
      [suffix]="suffix"
      [control]="password"
      [errorMessage]="errorMessage"
    >
      <ng-template #suffix>
        <app-input-hide-suffix [input]="input"></app-input-hide-suffix>
      </ng-template>
    </app-input>

    <div class="d-flex jc-between f-wrap">
      <app-checkbox class="mb-2 mr-1" [control]="rememberMe" label="Remember me"></app-checkbox>
      <p class="action-text" (click)="recover.emit()"> Forgot password</p>
    </div>

    <div class="d-flex jc-between f-wrap">
      <div>Don't have an account ?</div>
      <p class="action-text" (click)="signUp.emit()"> Sign up</p>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Cancel" (clicked)="cancel.emit()"></app-button>
    <app-button color="primary" text="Sign in" (clicked)="signIn()" [disabled]="state.loading || false"></app-button>
  </mat-dialog-actions>
</ng-container>
