<mat-form-field [appearance]="appearance" [color]="color" [class]="extendClass" [floatLabel]="floatLabel">
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [type]="inputType"
    [formControl]="control"
    [placeholder]="placeholder"
    [attr.maxlength]="maxlength"
  />
  <ng-container *ngIf="prefix" matPrefix>
    <ng-container [ngTemplateOutlet]="prefix"></ng-container>
  </ng-container>
  <ng-container *ngIf="suffix" matSuffix>
    <ng-container [ngTemplateOutlet]="suffix"></ng-container>
  </ng-container>
  <mat-hint *ngIf="hint" [align]="hintAlign" [class]="hintClass">
    <ng-container [ngTemplateOutlet]="hint"></ng-container>
  </mat-hint>
  <mat-error *ngIf="control.invalid && errorMessage">{{ errorMessage(control.errors) }}</mat-error>
</mat-form-field>
