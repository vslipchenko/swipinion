<div class="wrapper bg-dark h-100 d-flex f-column relative">
  <app-progress-bar
    *ngIf="loading$ | async"
    class="absolute t-0 w-100">
  </app-progress-bar>

  <div class="divider mb-2"></div>

  <div class="headline d-flex ai-center px-2 mb-2 w-100 mx-auto">
    <mat-icon class="mr-1">notifications</mat-icon>
    <h2>Notifications</h2>
  </div>

  <div class="primary-scrollbar pb-2">
    <div *ngIf="notifications$ | async as notifications" class="container mx-auto px-2 w-100">
      <app-content-placeholder *ngIf="!notifications.length; else notificationList"
                               text="Stay informed about important activity" class="d-block mt-2-3"
                               icon="circle_notifications"
      ></app-content-placeholder>

      <ng-template #notificationList>
        <ng-container *ngIf="notifications$ | async as notifications">
          <app-user-notification *ngFor="let notification of notifications; let last = last"
                                 [notification]="notification"
                                 class="d-block"
                                 [class.mb-2]="!last"
                                 (accept)="acceptFollowRequest(notification)"
                                 (decline)="declineFollowRequest(notification)"
                                 (delete)="deleteNotification(notification)"></app-user-notification>

          <app-progress-spinner
            *ngIf="canLoadMore$ | async"
            (appInView)="spinnerInView($event, notifications)"
            class="d-flex jc-center ai-center list-spinner"></app-progress-spinner>
        </ng-container>
      </ng-template>
    </div>
  </div>
</div>
