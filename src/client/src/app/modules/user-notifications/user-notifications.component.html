<div *ngIf="{loading: loading$ | async} as state" class="wrapper bg-dark h-100 d-flex f-column relative">
  <app-progress-bar
    *ngIf="state.loading"
    class="absolute t-0 w-100">
  </app-progress-bar>

  <div class="divider mb-2"></div>

  <div class="headline d-flex ai-center px-2 mb-2 w-100 mx-auto">
    <mat-icon class="mr-1">notifications</mat-icon>
    <h2>Notifications</h2>
  </div>

  <div class="primary-scrollbar pb-2">
    <div class="container mx-auto px-2 w-100">
      <!--      Nothing is here yet-->
      <app-user-notification *ngFor="let notification of notifications$ | async" [notification]="notification"
                             (accept)="acceptFollowRequest(notification)"
                             (decline)="declineFollowRequest(notification)"
                             (delete)="deleteNotification(notification)"></app-user-notification>
    </div>
  </div>
</div>
