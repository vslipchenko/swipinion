<div class="notification d-flex p-2 jc-between ai-center">
  <div class="d-flex ai-center">
    <div class="mr-1">
      <img *ngIf="notification.thumbnail" [src]="notification.thumbnail" alt=""
           routerLink="/user/{{notification.username}}" class="pointer">

      <div *ngIf="!notification.thumbnail" class="thumbnail pointer"
           routerLink="/user/{{notification.username}}"></div>
    </div>

    <div>
      <a class="truncate fw-medium link"
         routerLink="/user/{{notification.username}}">{{notification.username}}</a>
      <p class="fs-mini">{{notification.text}}</p>
    </div>
  </div>

  <div class="t-center">
    <div *ngIf="notification.timeElapsed$ | async as timeElapsed" class="date">{{timeElapsed}}</div>
    <app-icon-button *ngIf="menuItems.menu" [matMenuTriggerFor]="menuItems.menu"
                     icon="more_horiz"></app-icon-button>

    <app-menu-items #menuItems [items]="getOptions(notification.type)" [context]="notification"></app-menu-items>
  </div>
</div>
