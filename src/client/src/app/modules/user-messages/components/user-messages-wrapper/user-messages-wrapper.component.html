<div class="wrapper bg-dark h-100 d-flex f-column relative">
  <app-progress-bar
    *ngIf="messagesDirective.loading$ | async"
    class="absolute t-0 w-100">
  </app-progress-bar>

  <!--  <div class="px-2">-->
  <div class="divider mb-2"></div>
  <!--  </div>-->

  <div class="headline d-flex ai-center px-2 mb-2 w-100 mx-auto">
    <mat-icon svgIcon="email-multiple" class="mr-1"></mat-icon>
    <h2>Messages</h2>
  </div>


  <div class="container mx-auto px-2 w-100 h-100 d-flex mh-0">
    <app-message-list class="f-1"></app-message-list>

    <app-conversation-accordion *ngIf="conversation$ | async as conversation"
                                [conversation]="conversation"
                                (navigateProfile)="null"
                                class="f-1"></app-conversation-accordion>
  </div>
</div>
