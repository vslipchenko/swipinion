<div class="card relative h-100">
  <div class="bg-dark absolute h-100 w-100">
    <div class="background w-100 h-100"
         [style.background-image]="backgroundUrl"></div>
    <app-text-background-filler *ngIf="textBackground" class="absolute t-0 w-100 h-100 background-blurred c-dark"
                                [text]="body"
    ></app-text-background-filler>
  </div>

  <div class="container mx-auto d-flex f-column h-100 relative">
    <div class="glass">
      <div class="d-flex jc-between">
        <a class="d-flex ai-center py-1-2 px-2" routerLink="/user/{{username}}">
          <img class="thumbnail mr-1" src="https://i.imgur.com/8E4PsPL.jpeg" alt="">
          <span class="name">{{username}}</span>
        </a>

        <!--        <mat-icon>more_horiz</mat-icon>-->
        <app-icon-button icon="more_horiz" extendClass="card-more-button h-100 br-0 px-1"></app-icon-button>
      </div>

      <app-opinion-stats-panel class="d-flex bt-transparent" [agreed]="agreed" [disagreed]="disagreed"
                               [comments]="comments"></app-opinion-stats-panel>
    </div>

    <div appSwipe class="y-scrollbar transparent-scrollbar f-1" [class.glass]="!textContent"
         [class.bg-light]="textContent">
      <!--      <div class="d-flex">-->
      <img *ngIf="fileUrl" class="bg-light w-100"
           [src]="fileUrl"
           alt="">
      <!--      </div>-->

      <div *ngIf="textContent" class="content px-2 pt-2 pb-7-8 c-dark">
        <!--        <h2 class="title">{{title}}</h2>-->
        <p>
          {{body}}
