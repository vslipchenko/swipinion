<h2 mat-dialog-title>React with {{reaction}} comment</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="primary-scrollbar">
    <app-textarea
      [color]="commentButtonColor"
      appearance="outline"
      label="Comment"
      class="d-block w-100"
      extendClass="w-100"
      [control]="commentControl"
      hintAlign="end"
      [hint]="commentHint"
      [errorMessage]="commentErrorMessage.bind(this)"
    >
      <ng-template #commentHint>{{ commentControl.value?.length || 0 }} / {{ 3000 }}</ng-template>
    </app-textarea>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Cancel"></app-button>
    <app-button [color]="commentButtonColor" text="React" (clicked)="comment()"
                [disabled]="state.loading || !commentControl.value"></app-button>
  </mat-dialog-actions>
</ng-container>
