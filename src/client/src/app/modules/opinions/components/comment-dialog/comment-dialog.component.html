<h2 mat-dialog-title>React with comment</h2>

<mat-dialog-content class="primary-scrollbar">
  <app-textarea
    [color]="commentButtonColor"
    appearance="outline"
    label="Comment"
    class="d-block w-100"
    extendClass="w-100"
    [control]="commentControl"
    hintAlign="end"
    [hint]="commentHint"
    [errorMessage]="commentErrorMessage.bind(this)"
  >
    <ng-template #commentHint>{{ commentControl.value?.length || 0 }} / {{ 3000 }}</ng-template>
  </app-textarea>
</mat-dialog-content>
<mat-dialog-actions class="relative">
  <app-button mat-dialog-close text="Close"></app-button>
  <app-button [color]="commentButtonColor" [text]="reaction" (clicked)="reactWithComment()"
              [disabled]="!commentControl.value"></app-button>
</mat-dialog-actions>
