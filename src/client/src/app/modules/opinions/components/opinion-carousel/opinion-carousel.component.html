<app-opinion-card
  *ngFor="let item of data"
  class="h-100 w-100 absolute"
  [id]="item.id"
  [type]="item.type"
  [username]="item.username"
  [fileUrl]="item.file_url"
  [body]="item.body"
  [agreed]="item.agreed"
  [disagreed]="item.disagreed"
  [comments]="item.comments"
  [tags]="item.tags"
></app-opinion-card>

<div class="actions d-flex ai-center jc-around pb-1-2 w-100">
  <-- TODO Add auth guards for onclick events -->
  <app-icon-button class="smaller-icon" svgIcon="like-n-comment" extendClass="bg-dark"></app-icon-button>
  <app-icon-button class="smaller-icon" icon="thumb_up" extendClass="bg-dark" (clicked)="agree()"></app-icon-button>
  <app-icon-button icon="close" extendClass="bg-dark"></app-icon-button>
  <app-icon-button class="smaller-icon" icon="thumb_down" extendClass="bg-dark"
                   (clicked)="disagree()"></app-icon-button>
  <app-icon-button class="smaller-icon" svgIcon="dislike-n-comment" extendClass="bg-dark"></app-icon-button>
</div>
