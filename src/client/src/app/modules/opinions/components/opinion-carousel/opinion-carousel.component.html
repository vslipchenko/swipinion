<app-opinion-card
  *ngFor="let item of data"
  class="h-100"
  [id]="item.id"
  [type]="item.type"
  [title]="item.title"
  [username]="item.username"
  [fileUrl]="item.file_url"
  [description]="item.description"
  [agreed]="item.agreed"
  [disagreed]="item.disagreed"
  [comments]="item.comments"
  [tags]="item.tags"
></app-opinion-card>
