<app-opinion-card
  *ngFor="let item of data"
  class="h-100"
  [id]="item.id"
  [type]="item.type"
  [username]="item.username"
  [fileUrl]="item.file_url"
  [body]="item.body"
  [agreed]="item.agreed"
  [disagreed]="item.disagreed"
  [comments]="item.comments"
  [tags]="item.tags"
></app-opinion-card>
