<app-accordion [panelTitle]="settingsTitle" [content]="settingsContent">
  <ng-template #settingsTitle>
    <mat-icon class="mr-1">{{icon}}</mat-icon>
    {{title}}
  </ng-template>
  <ng-template #settingsContent>
    <div class="pb-2">
      <ng-container [ngTemplateOutlet]="content"></ng-container>

      <div class="d-flex jc-end" *ngIf="showActions">
        <app-button text="Cancel" (clicked)="cancel()"></app-button>
        <app-button text="Save" color="primary" (clicked)="save.emit()" [disabled]="disabledSave"></app-button>
      </div>
    </div>
  </ng-template>
</app-accordion>
