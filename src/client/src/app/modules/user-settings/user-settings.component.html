<div #wrapper class="wrapper bg-dark h-100 d-flex f-column px-2">
  <div class="divider mb-2"></div>

  <div class="container mx-auto w-100">
    <!--    <app-side-tabs></app-side-tabs>-->
    <div class="d-flex ai-center mb-2">
      <mat-icon class="mr-1">settings</mat-icon>
      <h2>Settings</h2>
    </div>

    <app-settings-accordion class="mb-1 d-block" icon="key" title="Password" [content]="passwordContent">
      <ng-template #passwordContent>
        <app-input
          #passwordInput
          extendClass="w-100"
          appearance="outline"
          label="Current password"
          type="password"
          [suffix]="passwordSuffix"
        >
          <ng-template #passwordSuffix>
            <app-input-hide-suffix [input]="passwordInput"></app-input-hide-suffix>
          </ng-template>
        </app-input>

        <app-input
          #passwordInput
          extendClass="w-100"
          appearance="outline"
          label="New password"
          type="password"
          [suffix]="passwordSuffix"
        >
          <ng-template #passwordSuffix>
            <app-input-hide-suffix [input]="passwordInput"></app-input-hide-suffix>
          </ng-template>
        </app-input>
      </ng-template>
    </app-settings-accordion>
    <app-settings-accordion class="mb-1 d-block" icon="lock" title="Privacy"></app-settings-accordion>
    <app-settings-accordion icon="check_circle" title="Verification"></app-settings-accordion>
  </div>
</div>
