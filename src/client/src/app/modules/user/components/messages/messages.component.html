<app-accordion extendClass="messages fixed" [hideToggle]="true" [panelTitle]="title" [panelDescription]="description"
               [content]="content">
  <ng-template #title>
      <span class="relative d-flex mr-1">
<!--              <div class="absolute badge"></div>-->
        <!--              <img src="https://i.ibb.co/7YwfY9M/photo.jpg" alt="" class="imagee">-->
              <mat-icon svgIcon="email-multiple" color="primary"></mat-icon>
            </span>
    Messages
  </ng-template>

  <ng-template #description>
    <app-icon-button class="mr-h" svgIcon="square-edit-outline"></app-icon-button>
    <mat-icon class="expand-arrow">expand_less</mat-icon>
  </ng-template>

  <ng-template #content>
    <p>This is the primary content of the panel.</p>
  </ng-template>
</app-accordion>
