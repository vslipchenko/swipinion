<app-progress-spinner *ngIf="loading$ | async; else content"
                      class="d-flex jc-center ai-center spinner"></app-progress-spinner>

<ng-template #content>
  <ng-container *ngIf="opinions$ | async as opinions">
    <!-- TODO: Add trackBy -->
    <app-content-placeholder *ngIf="!opinions.length; else opinionList" icon="article"
                             class="d-block mt-2-3"
                             [tip]="isProfilePath ? 'You can add new opinions through user menu\'s action «Add opinion»' : ''">
      <ng-container *ngIf="isProfilePath; else emptyContent">
        <app-button text="Share your opinion" class="mt-1 d-flex jc-center"
                    (clicked)="shareOpinion()"></app-button>
        <p class="mt-h t-center">with others!</p>
      </ng-container>

      <ng-template #emptyContent>
        <p class="mt-h t-center">User has not shared any opinions yet or it's private</p>
      </ng-template>
    </app-content-placeholder>

    <ng-template #opinionList>
      <app-opinion-preview *ngFor="let opinion of opinions" [username]="username" [id]="opinion.id"
                           [title]="opinion.title"
                           [description]="opinion.description" [fileUrl]="opinion.file_url"
                           [tags]="opinion.tags" class="opinion-preview d-block mt-2-3"></app-opinion-preview>

      <app-progress-spinner
        *ngIf="canLoadMore$ | async"
        (appInView)="spinnerInView($event, opinions)"
        class="d-flex jc-center ai-center list-spinner"></app-progress-spinner>
    </ng-template>
  </ng-container>
</ng-template>
