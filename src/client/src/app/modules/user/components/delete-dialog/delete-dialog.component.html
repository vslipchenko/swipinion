<h2 mat-dialog-title>Delete {{subject}}</h2>
<ng-container *ngIf="{loading: $any(loading$ | async)} as state">
  <mat-dialog-content class="mb-1">
    Do you want to delete this {{subject}}?
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Close"></app-button>
    <app-button color="warn" text="Delete" class="ml-1" (clicked)="delete()"
                [disabled]="state.loading"></app-button>
  </mat-dialog-actions>
</ng-container>
