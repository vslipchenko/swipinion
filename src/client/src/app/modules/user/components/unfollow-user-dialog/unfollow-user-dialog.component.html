<h2 mat-dialog-title>{{data.title}}</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="primary-scrollbar">
    <div class="t-center">
      <app-user-image [image]="profile.thumbnail" extendClass="mx-auto mb-2"></app-user-image>

      {{data.body}}
      <p class="mb-1"><span class="fw-medium">@{{profile.username}}</span> ?</p>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Cancel"></app-button>
    <app-button color="warn" [text]="data.action" (clicked)="unfollow()"
                [disabled]="state.loading || false"></app-button>
  </mat-dialog-actions>
</ng-container>
