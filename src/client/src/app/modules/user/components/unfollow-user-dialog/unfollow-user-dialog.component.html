<h2 mat-dialog-title>Unfollow user</h2>
<ng-container *ngIf="{loading: loading$ | async} as state">
  <div *ngIf="state.loading" class="dialog-loading-veil"></div>

  <mat-dialog-content class="primary-scrollbar">
    <div class="t-center">
      <img
        class="image d-block mx-auto mb-2"
        src="https://previews.123rf.com/images/darkbird/darkbird1704/darkbird170400024/75707358-funny-man-taking-selfie-isolated-on-white.jpg"
        alt="">

      Unfollow
      <p><span class="fw-medium">@someone</span> ?</p>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions class="relative">
    <app-progress-bar
      *ngIf="state.loading"
      class="absolute t-0 dialog-progress-bar">
    </app-progress-bar>

    <app-button mat-dialog-close text="Cancel"></app-button>
    <app-button color="warn" text="Unfollow" (clicked)="unfollow.emit()"
                [disabled]="state.loading || false"></app-button>
  </mat-dialog-actions>
</ng-container>
