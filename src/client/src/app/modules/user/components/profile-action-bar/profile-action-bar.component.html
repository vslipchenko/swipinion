<div class="d-flex jc-around ai-center w-100">
  <div class="pointer">
    <app-statistics-action class="d-flex"></app-statistics-action>
  </div>

  <div class="d-flex pointer" [appAuthClick]="message">
    <mat-icon>email</mat-icon>
  </div>
  <div class="d-flex pointer" [appAuthClick]="follow">
    <mat-icon color="primary">person_add</mat-icon>
  </div>
</div>

<div class="userbar fixed w-100 p-1 d-flex ai-center jc-between" [class.show]="showBottomBar">
  <div class="userbar-info d-flex ai-center f-1" (click)="scrollTop()">
    <img src="https://i.ibb.co/3WhDXQv/Ancient-Splendid-Lacewing-size-restricted.gif" alt="" class="user-image mr-1">
    <span class="fw-medium truncate">someone</span>
  </div>

  <app-icon-button color="primary" icon="person_add" (clicked)="follow()"></app-icon-button>
</div>
