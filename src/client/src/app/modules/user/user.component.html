<div #wrapper *ngIf="profile$ | async as profile" class="wrapper bg-dark h-100 d-flex">
  <div class="relative w-100">
    <div class="stripe absolute w-100"></div>

    <div #userBlock class="user-block d-flex f-column ml-auto">
      <div class="relative mx-auto">
        <img
          *ngIf="profile.thumbnail"
          [src]="profile.thumbnail"
          class="d-block image"
          alt="">

        <div *ngIf="!profile.thumbnail" class="image"></div>

        <app-mini-fab-button svgIcon="account-edit" class="edit-profile absolute"
                             (clicked)="openEditProfile()"></app-mini-fab-button>
      </div>


      <div class="user-info">
        <div class="username fw-medium t-center">{{profile.username}}</div>

        <div class="divider my-2"></div>

        <app-profile-action-bar [username]="profile.username" [thumbnail]="profile.thumbnail"
                                [showBottomBar]="$any(showBottomBar$ | async)"
                                [wrapper]="wrapper"></app-profile-action-bar>

        <div *ngIf="profile.bio" class="divider my-2"></div>

        <div class="bio">{{profile.bio}}</div>
      </div>
    </div>
  </div>


  <div class="container d-flex f-column primary-scrollbar px-2-3">
    <app-tabs [tabs]="['Opinions', 'Reactions', 'Shares']" color="accent" headerPosition="below"
              class="tabs d-block bg-dark"></app-tabs>

    <div *ngIf="opinions$ | async as opinions" class="content pb-2-3">
      <!-- TODO: Add trackBy -->
      <app-opinion-preview *ngFor="let opinion of opinions" [username]="profile.username" [id]="opinion.id"
                           [title]="opinion.title"
                           [description]="opinion.description" [fileUrl]="opinion.file_url"
                           [tags]="opinion.tags" class="d-block mt-2-3"></app-opinion-preview>

      <app-flat-button *ngIf="canLoadMore$ | async" text="Load more" color="primary" extendClass="w-100 mt-2-3"
                       icon="visibility" (clicked)="fetchUserOpinions(opinions.length + 1)"></app-flat-button>
    </div>
  </div>
</div>
