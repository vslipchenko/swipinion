<h2 mat-dialog-title>Sign up</h2>
<mat-dialog-content class="visible relative py-2">
  <app-progress-spinner *ngIf="loading$ | async" class="overlay bg-fog"></app-progress-spinner>

  <app-input
    class="d-block mb-1"
    extendClass="w-100"
    appearance="outline"
    label="Username"
    [control]="username"
    [errorMessage]="usernameErrorMessage"
    [hint]="usernameHint"
  >
    <ng-template #usernameHint>
      Can contain lowercase letters with dot as a separator
    </ng-template>
  </app-input>
  <app-input
    class="d-block mb-1"
    extendClass="w-100"
    appearance="outline"
    label="Email"
    type="email"
    [control]="email"
    [errorMessage]="emailErrorMessage"
  ></app-input>
  <app-input
    #passwordInput
    class="d-block"
    extendClass="w-100"
    appearance="outline"
    label="Password"
    type="password"
    [control]="password"
    [errorMessage]="passwordErrorMessage"
    [suffix]="suffix"
    [hint]="passwordHint"
  >
    <ng-template #passwordHint>
      At least one letter and digit. Allowed special characters
    </ng-template>

    <ng-template #suffix>
      <app-input-hide-suffix [input]="passwordInput"></app-input-hide-suffix>
    </ng-template>
  </app-input>
</mat-dialog-content>
<mat-dialog-actions>
  <app-button mat-dialog-close text="Cancel" (clicked)="cancel.emit()"></app-button>
  <app-button color="primary" text="Sign up" (clicked)="signUp()"></app-button>
</mat-dialog-actions>
